[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndfeb-uvvis"
version = "0.1.0"
description = "UV-Vis PLS / PLS-DA pipeline for in-line monitoring of hydrometallurgical NdFeB magnet recycling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Samuel D. Widijatmoko" }]
keywords = ["chemometrics", "UV-Vis", "PLS", "process analytical technology", "rare earth", "recycling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "joblib>=1.3",
    "scikit-learn>=1.5",
    "chemotools>=0.4.4,<0.5",  # uses the window_length / polyorder / deriv SavitzkyGolay API
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8", "tabulate>=0.9"]
dev = ["pytest>=8", "matplotlib>=3.8", "tabulate>=0.9"]

[project.urls]
Paper = "https://doi.org/10.1016/j.hazadv.2026.101540"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
